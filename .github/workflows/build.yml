name: Build C++ Android APK

# تشغيل يدوي فقط بضغطة زر (لحفظ الحصة المجانية تماماً)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # تسريع البناء وحفظ الملفات المترجمة سحابياً (ccache)
      - name: Setup ccache for fast compilation
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-vulkan-render

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Compile Shaders to SPIR-V C-Headers
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          GLSLC=${ANDROID_NDK_HOME}/shader-tools/linux-x86_64/glslc
          mkdir -p src/shaders
          $GLSLC src/shaders/cube.vert -mfmt=c -o src/shaders/cube_vert.h
          $GLSLC src/shaders/cube.frag -mfmt=c -o src/shaders/cube_frag.h
          $GLSLC src/shaders/line.vert -mfmt=c -o src/shaders/line_vert.h
          $GLSLC src/shaders/line.frag -mfmt=c -o src/shaders/line_frag.h

      - name: Build C++ Vulkan Engine with CMake
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package & Sign APK
        run: |
          mkdir -p apk_build/lib/arm64-v8a
          cp build/librender_engine.so apk_build/lib/arm64-v8a/
          
          keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Render, OU=Dev, O=Dev, L=City, S=State, C=US"
          
          ${{ env.ANDROID_HOME }}/build-tools/34.0.0/aapt package -f -M AndroidManifest.xml -I ${{ env.ANDROID_HOME }}/platforms/android-34/android.jar -F build/unaligned.apk
          cd apk_build && zip -r ../build/unaligned.apk lib/ && cd ..
          ${{ env.ANDROID_HOME }}/build-tools/34.0.0/zipalign -v -p 4 build/unaligned.apk build/RenderApp.apk
          ${{ env.ANDROID_HOME }}/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:password123 --key-pass pass:password123 --out build/Render-Official.apk build/RenderApp.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Render-Engine-Vulkan
          path: build/Render-Official.apk
